# zenit.com.ve: sirve la exportación estática de Next.js (out/).
# Traefik termina TLS y reenvía al puerto 80 de este contenedor.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # Redirecciones relativas: detrás de Traefik, nginx no conoce el esquema ni el host público.
    absolute_redirect off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Sin barra final: /productos/ → /productos (las páginas son archivos .html).
    rewrite ^/(.+)/$ /$1 permanent;

    # Recursos con hash en el nombre: caché de un año, inmutable.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes (logos, fotos de producto, diagramas): caché larga. Sus nombres no llevan
    # hash: si se reemplaza una foto con el mismo nombre, puede tardar hasta 30 días en verse.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Páginas: siempre se revalidan para que un despliegue nuevo se vea al instante.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Página 404 propia (generada por Next.js en out/404.html).
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
