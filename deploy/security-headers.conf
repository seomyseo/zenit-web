# Cabeceras de seguridad (se incluyen en cada location: en nginx, un add_header
# dentro de un location anula los heredados del server).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HTTPS lo fuerza Traefik; HSTS para que el navegador no vuelva a intentar HTTP.
add_header Strict-Transport-Security "max-age=15552000" always;
