# zenit.com.ve detrás del Traefik que ya corre en el VPS.
# Ningún servicio publica puertos: Traefik llega por la red externa "traefik".
#   zenit-web  → todo el sitio (nginx, estático)
#   zenit-api  → solo /api/ (formulario de contacto por correo)
# Actualizar: git pull && docker compose up -d --build

services:
  zenit-web:
    build:
      context: .
      target: web
      # Variables de BUILD (se incrustan al compilar). Se leen de .env (no va a git).
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Falta NEXT_PUBLIC_SITE_URL en .env}
        NEXT_PUBLIC_WHATSAPP_URL: ${NEXT_PUBLIC_WHATSAPP_URL:-}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-false}
    image: zenit-web:latest
    container_name: zenit-web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik

      # Router HTTPS (HTTP → HTTPS ya lo redirige Traefik). Incluye www para que el
      # certificado (TLS-ALPN, myresolver) cubra ambos nombres.
      - traefik.http.routers.zenit.rule=Host(`zenit.com.ve`) || Host(`www.zenit.com.ve`)
      - traefik.http.routers.zenit.entrypoints=websecure
      - traefik.http.routers.zenit.tls=true
      - traefik.http.routers.zenit.tls.certresolver=myresolver
      - traefik.http.routers.zenit.service=zenit
      - traefik.http.routers.zenit.middlewares=zenit-www-redirect

      # Para proteger con usuario y contraseña mientras el sitio no esté aprobado,
      # sustituir la línea de middlewares de arriba por estas dos (ver README):
      # - traefik.http.routers.zenit.middlewares=zenit-www-redirect,zenit-auth
      # - traefik.http.middlewares.zenit-auth.basicauth.users=${ZENIT_BASIC_AUTH_USERS}

      # www.zenit.com.ve → zenit.com.ve (301). En compose, "$" se escapa como "$$".
      - traefik.http.middlewares.zenit-www-redirect.redirectregex.regex=^https://www\.zenit\.com\.ve/(.*)
      - traefik.http.middlewares.zenit-www-redirect.redirectregex.replacement=https://zenit.com.ve/$${1}
      - traefik.http.middlewares.zenit-www-redirect.redirectregex.permanent=true

      # nginx escucha en el 80 interno.
      - traefik.http.services.zenit.loadbalancer.server.port=80

  zenit-api:
    build:
      context: .
      target: api
    image: zenit-api:latest
    container_name: zenit-api
    restart: unless-stopped
    # Variables de EJECUCIÓN (no de build), solo en el .env del servidor. Si falta
    # SMTP_HOST o MAIL_FROM, el servicio sale con un mensaje claro en los logs y el
    # formulario ofrece WhatsApp; el resto del sitio sigue funcionando.
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-mercadeo@lefre.com.ve}
    # Endurecimiento: usuario sin privilegios (en la imagen), sistema de archivos de
    # solo lectura, sin capacidades de Linux y con memoria limitada.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik

      # Solo /api/ de zenit.com.ve. La prioridad explícita gana al router "zenit"
      # (cuya regla es más larga y, sin prioridad, se llevaría también /api/).
      - traefik.http.routers.zenit-api.rule=Host(`zenit.com.ve`) && PathPrefix(`/api/`)
      - traefik.http.routers.zenit-api.priority=100
      - traefik.http.routers.zenit-api.entrypoints=websecure
      - traefik.http.routers.zenit-api.tls=true
      - traefik.http.routers.zenit-api.tls.certresolver=myresolver
      - traefik.http.routers.zenit-api.service=zenit-api

      # Node escucha en el 3001 interno.
      - traefik.http.services.zenit-api.loadbalancer.server.port=3001

networks:
  traefik:
    external: true
